name: "Release Dev Container Templates"
on:
  # Publish when a GitHub Release (with its tag) is published, or manually.
  release:
    types: [published]
  workflow_dispatch:

jobs:
  # No test job on purpose: the smoke tests are run locally before releasing
  # (bash scripts/test.sh all). Run the "Test Templates" workflow manually if you
  # want them on a runner too.
  publish:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: "Publish Templates"
        uses: devcontainers/action@v1
        with:
          publish-templates: "true"
          base-path-to-templates: "./src"
          generate-docs: "false"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
