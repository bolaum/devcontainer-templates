name: "Release Dev Container Templates"
on:
  # Publish when a GitHub Release (with its tag) is published, or manually.
  release:
    types: [published]
  workflow_dispatch:

jobs:
  # No test job on purpose: the smoke tests are run locally before releasing
  # (bash scripts/test.sh all). Run the "Test Templates" workflow manually if you
  # want them on a runner too.
  publish:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      # write, not read: besides pushing to GHCR, the action tags the commit as
      # <template-id>_<version> (e.g. template_base_1.4.0) so each template's own
      # version is traceable to a commit — they version independently of the
      # repo's release tag. With contents: read it logs "Failed to automatically
      # add repo tag" and carries on.
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: "Publish Templates"
        uses: devcontainers/action@v1
        with:
          publish-templates: "true"
          base-path-to-templates: "./src"
          generate-docs: "false"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
